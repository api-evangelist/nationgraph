- id: oauth2
  conforms: true
  method: probed
  evidence: >-
    RFC 6749 authorization server at https://api.nationgraph.com/auth with authorize, token,
    introspect (RFC 7662) and revoke (RFC 7009) endpoints; grants authorization_code,
    client_credentials, refresh_token.
  corrects: '2026-07-20 assessment recorded conforms:false (no oauth2 scheme in the OpenAPI)'
- id: openid-connect
  conforms: true
  method: probed
  evidence: >-
    OIDC Core provider — issuer, userinfo endpoint, EdDSA-signed id_tokens, public subject types,
