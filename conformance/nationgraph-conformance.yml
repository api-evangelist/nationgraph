    MCP endpoint's 401 also returns the matching `WWW-Authenticate: Bearer resource_metadata=...`
    parameter, so the two halves of RFC 9728 agree with each other.
  note: >-
    The strongest conformance result in this profile, and a genuinely uncommon one — most
    providers that ship an MCP server do not ship the protected-resource descriptor that makes it
    discoverable.
