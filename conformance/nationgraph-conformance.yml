note: >-
  UPGRADED from derived (2026-07-20) to probed (2026-08-14). The July assessment was made from
  the OpenAPI alone and marked oauth2 and openid-connect FALSE. Both were wrong: NationGraph runs
  a conformant OAuth 2.0 / OIDC authorization server that the OpenAPI simply never declared.
  Those two rows are corrected here, and six standards the OpenAPI could not have revealed —
  RFC 8414, RFC 9728, RFC 7591, PKCE, OIDC Discovery and MCP — are assessed for the first time.
standards:
