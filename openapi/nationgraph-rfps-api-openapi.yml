          - type: 'null'
          title: Rfp Url
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        institution_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution Id
        institution_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution Name
        institution_state:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution State
        institution_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution Type
        status:
          anyOf:
          - $ref: '#/components/schemas/RFPStatus'
          - type: 'null'
        days_until_due:
          anyOf:
          - type: integer
          - type: 'null'
          title: Days Until Due
        relevance:
          anyOf:
          - type: number
          - type: 'null'
          title: Relevance
      type: object
      required:
      - id
      title: RFPResponse
      description: Lean RFP response — drops the institution-metadata bloat from the v3 shape.
    RFPStatus:
      type: string
      enum:
      - active
      - expired
      - no_due_date
      title: RFPStatus
    RFPInstitutionOptionsResponse:
      properties:
        institutions:
          items:
            type: string
          type: array
          title: Institutions
      type: object
      required:
      - institutions
      title: RFPInstitutionOptionsResponse
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
