          anyOf:
          - type: string
          - type: 'null'
          title: Contact Url Status
        rfp_url_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Rfp Url Status
        meeting_minute_url_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Meeting Minute Url Status
        budget_url_status:
          anyOf:
          - type: string
