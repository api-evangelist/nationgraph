components:
  schemas:
    ContactsExportConfig:
      properties:
        version:
          type: string
          title: Version
        filters:
          items:
            $ref: '#/components/schemas/UserProfileInstitutionFilter'
          type: array
          title: Filters
        role_types:
          items:
            type: string
          type: array
          title: Role Types
          default: []
        exclude_titles:
          items:
            type: string
          type: array
          title: Exclude Titles
          default: []
        hard_match:
          type: boolean
          title: Hard Match
          default: false
      type: object
      required:
      - version
      - filters
      title: ContactsExportConfig
    AutomationRefreshResponse:
      properties:
        updated_institution_ids:
          items:
            type: string
          type: array
          title: Updated Institution Ids
      type: object
      required:
      - updated_institution_ids
      title: AutomationRefreshResponse
    InstitutionFiltersEnum:
      type: string
      enum:
      - institution_type
      - institution_list
      title: InstitutionFiltersEnum
    AutomationRunDetailResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        automation_id:
          type: string
          format: uuid
          title: Automation Id
        status:
          $ref: '#/components/schemas/AutomationExecutionStatus'
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        created_at:
          type: string
          format: date-time
          title: Created At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        result_status_counts:
          additionalProperties:
            type: integer
          type: object
          title: Result Status Counts
        institution_count:
          type: integer
          title: Institution Count
          default: 0
      type: object
      required:
      - id
      - automation_id
      - status
      - created_at
      - result_status_counts
      title: AutomationRunDetailResponse
    EnrichedSignal:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        signal_setting_id:
          type: string
          format: uuid
          title: Signal Setting Id
        institution_id:
          type: string
          title: Institution Id
        significance:
          $ref: '#/components/schemas/SignalSignificance'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
        title:
