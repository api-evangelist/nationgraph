          description: Email address
        Phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
          description: Phone number
        MobilePhone:
          anyOf:
          - type: string
          - type: 'null'
          title: Mobilephone
          description: Mobile phone
        Website:
          anyOf:
          - type: string
          - type: 'null'
          title: Website
          description: Company website
        Street:
          anyOf:
          - type: string
          - type: 'null'
