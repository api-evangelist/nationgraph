          - type: string
          - type: 'null'
          title: State
          description: State/province
        PostalCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Postalcode
          description: Postal code
        Country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
          description: Country
        Industry:
          anyOf:
          - type: string
          - type: 'null'
          title: Industry
          description: Industry
        NumberOfEmployees:
          anyOf:
          - type: integer
          - type: 'null'
          title: Numberofemployees
          description: Number of employees
        AnnualRevenue:
          anyOf:
          - type: number
          - type: 'null'
          title: Annualrevenue
          description: Annual revenue
        Status:
          anyOf:
          - type: string
          - type: 'null'
