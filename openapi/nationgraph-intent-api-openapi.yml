openapi: 3.1.0
info:
  title: Nationgraph Accounts Intent API
  version: 0.2.36
tags:
- name: Intent
paths:
  /api/v3/intent/get-company-info:
    post:
      tags:
      - Intent
      summary: Get Company Info
      operationId: get_company_info_api_v3_intent_get_company_info_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentInfoRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v3/intent/create-company-rubrics:
    post:
      tags:
      - Intent
      summary: Create Company Rubrics
      operationId: create_company_rubrics_api_v3_intent_create_company_rubrics_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
components:
  schemas:
    IntentInfoRequest:
      properties:
        company_website:
          type: string
          title: Company Website
      type: object
      required:
      - company_website
      title: IntentInfoRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
