summary: >-
  NationGraph serves a real, first-party OAuth 2.0 / OpenID Connect discovery surface on the API
  host, api.nationgraph.com. The 2026-07-20 round probed only the marketing host and recorded a
  clean 404 sweep; re-probing the API host this round found three live documents, including an
  RFC 9728 protected-resource descriptor that points at an undocumented MCP server. The marketing
  host (nationgraph.com) and the app host (app.nationgraph.com) still serve nothing under
  /.well-known/ — app.nationgraph.com answers every path with a 19KB Next.js SPA shell under a
  404 status, which is NOT a document and is recorded here as a miss.
hosts:
- host: https://api.nationgraph.com
  role: API host
  hits: 3
  documents:
  - path: /.well-known/openid-configuration
    status: 200
    content_type: application/json
    file: nationgraph-openid-configuration.json
    note: >-
      OpenID Provider metadata. issuer https://api.nationgraph.com/auth. EdDSA-signed id_tokens,
      PKCE S256 required, RFC 7591 dynamic client registration endpoint present. Claim set
      (org_id / org_role / org_slug / azp / sid) indicates a Clerk-backed identity provider
      fronted on NationGraph's own domain.
  - path: /.well-known/oauth-authorization-server
    status: 200
    content_type: application/json
    file: nationgraph-oauth-authorization-server.json
    note: >-
      RFC 8414 Authorization Server metadata. Byte-identical to the openid-configuration
      document (both 1557 bytes) — the same handler answers both paths.
  - path: /.well-known/oauth-protected-resource
    status: 200
    content_type: application/json
    file: nationgraph-oauth-protected-resource.json
    note: >-
      RFC 9728 Protected Resource metadata. THE MOST CONSEQUENTIAL FIND OF THIS ROUND — it names
      resource https://api.nationgraph.com/internal/mcp with scopes_supported [mcp:read,
      offline_access] and resource_name "NationGraph". This is how the MCP server was discovered;
      it is documented nowhere else on NationGraph's public surface. See mcp/nationgraph-mcp.yml.
