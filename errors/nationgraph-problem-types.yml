  media_type: application/json
  problem_json: false
surface_divergence: >-
  The MCP server at /internal/mcp does NOT use this envelope. It returns bare `text/plain` bodies
  (observed: "no bearer token" on a 401), so NationGraph's two surfaces disagree on error format.
  An agent handling both must parse two shapes. See conventions/nationgraph-conventions.yml.
