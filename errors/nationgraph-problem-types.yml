format: fastapi
note: >-
  NationGraph runs a FastAPI service. Client errors use FastAPI's default JSON
  envelope: a top-level `detail` field. Validation failures (422) return
  `detail[]` arrays of ValidationError objects (loc / msg / type). This is not
  RFC 9457 problem+json. Derived from the OpenAPI responses; the 401 and 404 shapes were then
  CONFIRMED VERBATIM against live responses on 2026-08-14, upgrading this artifact from derived
  to probed. Titles/remediation for the statuses not reachable anonymously remain inferred from
  standard FastAPI + HTTP Bearer semantics.
envelope:
