method: probed
source: >-
  live probes of api.nationgraph.com (2026-08-14) +
  openapi/_original/nationgraph-openapi-original.json (harvested 2026-07-20)
versioning:
  scheme: uri-path
  current: v3
  base_path: /api/v3
  spec_version: '0.2.36'
  spec_version_note: >-
    Last observed specification version. Cannot be re-read — see contract_availability below.
  docs: null
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation policy, no versioning policy, and no RFC 8594 Sunset/Deprecation header
    support. Nothing published tells a consumer how much notice they would get before a breaking
    change.
contract_availability:
  status: withdrawn
  observed: '2026-08-14'
  previously_observed: '2026-07-20'
  finding: >-
    THE MACHINE-READABLE CONTRACT HAS BEEN WITHDRAWN. On 2026-07-20 NationGraph served an
    OpenAPI 3.1.0 specification (v0.2.36, 212 paths / 253 operations) at
    https://api.nationgraph.com/openapi.json alongside interactive Swagger UI at /docs. As of
    2026-08-14 both return HTTP 404 `{"detail":"Not Found"}`, as do /redoc, /swagger.json,
    /openapi.yaml, /api-docs and every versioned variant probed. The pattern is exactly what
    FastAPI produces when an application is redeployed with `openapi_url=None, docs_url=None` —
    a deliberate configuration change, not an outage.
  api_still_live: true
  api_evidence: >-
    The API itself is unaffected and fully operational. /api/v3/lists, /api/v3/contacts,
    /api/v3/workspaces/institutions and POST /api/v3/signals/search all return 401
    "Not authenticated" (not 404), and the API root returns 200
    {"message":"Hello, welcome to the NationGraph API"}. Only the DISCOVERY surface was removed.
  net_effect: >-
    NationGraph moved in two opposite directions in the same three weeks. It withdrew the REST
    contract that let a developer discover the API, and it stood up an OAuth-discoverable MCP
    server that lets an agent discover it. The human-facing developer surface got smaller while
    the agent-facing one got larger.
  our_copy: >-
    openapi/_original/nationgraph-openapi-original.json is our verbatim capture from 2026-07-20,
    and is now the only public record of this contract. Everything derived in this repo carries
    that date and that provenance. It must NOT be presented as currently discoverable.
  probes:
  - {url: 'https://api.nationgraph.com/openapi.json', status: 404}
  - {url: 'https://api.nationgraph.com/docs', status: 404}
  - {url: 'https://api.nationgraph.com/redoc', status: 404}
  - {url: 'https://api.nationgraph.com/swagger.json', status: 404}
  - {url: 'https://api.nationgraph.com/openapi.yaml', status: 404}
  - {url: 'https://api.nationgraph.com/api-docs', status: 404}
  - {url: 'https://api.nationgraph.com/', status: 200}
