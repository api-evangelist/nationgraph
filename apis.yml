image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/nationgraph.png
name: NationGraph
description: >-
  NationGraph is a public-sector sales intelligence platform that makes government
  buying legible to businesses selling into state, local, and education (SLED)
  markets. It indexes roughly 110,000 government institutions and ~4 million
  government webpages — council meeting minutes, budgets, purchase orders,
  contracts, capital improvement plans, and active RFPs — to surface predictive
  buying signals before a formal RFP is published. Its Signals product flags buying
  intent, Contacts matches verified government decision-makers with emails and
  phone numbers, and Public Record Automations run FOIA requests and structured
  document extraction into existing CRM and communications tools (Salesforce,
  HubSpot, Slack). Founded in 2024 (Miami, with Toronto and San Francisco offices),
  NationGraph has raised $22.5M, with a Series A led by Menlo Ventures.
